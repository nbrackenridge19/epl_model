name: ESPN lineup poller

# Runs every 10 minutes, but only 7am-4pm Eastern (11:00-21:00 UTC covers
# both EDT and EST, since the season spans the DST boundary) -- matches
# don't kick off outside this window. Also has a free, no-credit-cost
# gameday check inside the script itself (queries our own already-synced
# fixture list) that skips the run entirely with zero ScraperAPI usage
# on days with no matches at all.
on:
  schedule:
    - cron: "*/10 11-21 * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary

      - name: Run lineup poller
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPERAPI_PROXY_URL: ${{ secrets.SCRAPERAPI_PROXY_URL }}
        run: python scripts/poll_espn_lineups.py
