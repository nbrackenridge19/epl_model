name: ESPN lineup poller

# Runs every 5 minutes (GitHub Actions' shortest supported interval --
# below 5 min isn't reliably honored), but only 7am-4pm Eastern
# (11:00-21:00 UTC covers both EDT and EST, since the season spans the
# DST boundary) -- matches don't kick off outside this window. Also has
# a free, no-credit-cost gameday check inside the script itself (queries
# our own already-synced fixture list) that skips the run entirely with
# zero ScraperAPI usage on days with no matches at all.
#
# Bumped from */10 to */5 on 2026-09-04 after missing a 3pm ET kickoff's
# lineup window. Worth knowing this doesn't guarantee catching every
# match: GitHub Actions scheduled workflows are best-effort and can run
# late during high load (lots of repos fire cron jobs on round intervals
# like this one, so busy times -- e.g. Saturday early afternoon, a
# popular EPL kickoff slot -- see the most congestion). 5 minutes is the
# floor GitHub supports; a true fix would mean triggering off the actual
# fixture list (e.g. a workflow that computes each match's kickoff time
# and schedules a one-off run ~60-90 min prior) rather than a fixed
# cron -- bigger change, not done here.
on:
  schedule:
    - cron: "*/5 11-21 * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary

      - name: Run lineup poller
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPERAPI_PROXY_URL: ${{ secrets.SCRAPERAPI_PROXY_URL }}
        run: python scripts/poll_espn_lineups.py
