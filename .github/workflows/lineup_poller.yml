name: ESPN lineup poller

# HOURLY, 5am-6pm Eastern (09:00-22:00 UTC covers both EDT and EST,
# since the season spans the DST boundary). Redesigned 2026-09-05.
#
# Previously this ran every 5 (then every 10) minutes, relying on
# GitHub's schedule trigger firing reliably at that cadence. It empirically
# didn't: real run history showed multi-hour gaps between consecutive
# "Scheduled" runs even at a nominal 5-minute interval (e.g. a 4-hour gap
# between two consecutive runs) -- consistent with GitHub's scheduler
# silently dropping the large majority of ticks for a high-frequency
# schedule, not just running a few minutes late.
#
# The fix: ask GitHub's scheduler for something much less frequent
# (hourly -- hypothesized to be more reliable given GitHub explicitly
# cites "high load" as the cause of delays, and load scales with
# requested frequency; this is a bet, not proven for this account) and
# do the actual precision timing INSIDE the script itself via
# time.sleep(), once a run starts. poll_espn_lineups.py now:
#   - Phase A: keeps matches.kickoff_time populated a few days ahead by
#     reading ESPN's own kickoff timestamps (piggybacked on the same
#     scoreboard call the script was already making).
#   - Phase B: checks whether any of today's matches has kickoff inside
#     an ~80-minute actionable window; if so, polls for the lineup every
#     ~4 minutes IN-PROCESS until found or the window closes, entirely
#     independent of the GitHub scheduler at that point.
# An 80-minute window against an hourly trigger mathematically
# guarantees at least one tick lands inside it for every match, as long
# as hourly ticks themselves don't get dropped.
#
# If runs still go missing at this frequency, that's real evidence
# GitHub's scheduler can't be trusted here at ANY frequency, and the
# next step is triggering externally (e.g. a Cloudflare Worker cron
# hitting the workflow_dispatch API) instead of via `schedule:` at all.
#
# UPDATE 2026-09-05: the hourly-on-the-hour cron above still didn't fire
# at all (confirmed: zero scheduled runs in Actions history despite
# workflow_dispatch working every time). Two changes based on real
# reports of this exact symptom in GitHub's own community forums:
#   1. Moved off :00 -- the top of every hour is GitHub's single most
#      congested scheduler moment (everyone's hourly crons fire then),
#      and GitHub's own guidance is to offset for exactly this reason.
#   2. This edit itself is also a "resync" -- pushing any change to a
#      workflow file's schedule can force GitHub to re-register the
#      trigger, which has fixed identical total-silence symptoms for
#      other users after a platform-side Actions incident (there was
#      one on 2026-08-26, per GitHub's status history).
# If this STILL doesn't fire, that's strong enough evidence to stop
# trying to fix `schedule:` itself and move to an external trigger.
on:
  schedule:
    - cron: "17 9-22 * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 100  # generous margin over the ~80 min a single actionable-match run can take
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary

      - name: Run lineup poller
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPERAPI_PROXY_URL: ${{ secrets.SCRAPERAPI_PROXY_URL }}
        run: python scripts/poll_espn_lineups.py
