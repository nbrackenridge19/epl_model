name: Generate dashboard

# Runs on the same frequent schedule as the lineup poller/odds scraper --
# cheap to run (pure database reads, no ScraperAPI credits involved), so
# no need for the same gameday pre-check those use to conserve credits.
# Only commits back to the repo if the generated HTML actually changed,
# so this doesn't create a flood of empty commits when nothing's new.
on:
  schedule:
    - cron: "*/10 11-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# The timed lineup/odds workflows also start this workflow, so make sure two runs never overlap and
# race each other to push docs/index.html.
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "sqlalchemy<2.1" psycopg2-binary patsy scipy

      # Settle any finished games first (fills in outcome/profit on bets whose match is now 'completed').
      # settle_bets.py is idempotent -- it only touches bets whose outcome is still null -- so running it here every
      # time is harmless. Without this, a bet stays "pending" on the dashboard until the once-a-day 08:00 UTC
      # settle_bets.yml run, which fires at the same minute as the FBref scraper and so often runs before the
      # scraper has marked the match completed (-> another full day of "pending"). Settling here also means the
      # bankroll used to size new stakes includes results as soon as they are in.
      - name: Settle finished bets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/settle_bets.py

      - name: Generate dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/generate_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && exit 0
          git commit -m "Update dashboard"
          # Rebase onto whatever landed on main during this run (e.g. a manual push)
          # before pushing; retry a few times in case main moves again.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
