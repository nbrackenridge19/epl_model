name: ESPN odds scraper (daily opening sweep)

# Once a day, scans the full week ahead and stores the first odds snapshot for any new fixture
# (line_type = 'opening'). The script skips any match that already has a snapshot.
#
# The old every-15-minutes "frequent" job is gone: the lineup_release (T-50) and closing (T-5)
# snapshots are now captured per match at exact times by epl_odds_trigger.yml, started by the
# Cloudflare trigger Worker.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  opening_sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests "sqlalchemy<2.1" psycopg2-binary
      - name: Run odds scraper (full week ahead, opening snapshots only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPERAPI_PROXY_URL: ${{ secrets.SCRAPERAPI_PROXY_URL }}
          ODDS_MODE: sweep
          ODDS_DAYS_BACK: "0"
          ODDS_DAYS_FORWARD: "7"
        run: python scripts/scrape_espn_odds.py
